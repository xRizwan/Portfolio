  <path d="M40 721H1080" stroke="#413b36"/><text x="40" y="751" font-family="monospace" font-size="11" fill="#b3a99e">Cross-cutting: OpenTelemetry traces / retries / idempotent consumers / dead-letter handling</text>
</svg>